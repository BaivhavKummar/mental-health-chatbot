<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mental Health Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to your AI Mental Health Assistant</h1>

        <!-- Section for Onboarding (Initially Hidden) -->
        <div id="onboarding-section" class="section">
            <h2>Let's get to know you (Optional)</h2>
            <form id="onboarding-form">
                <!-- Add input fields based on your questionnaire -->
                <label for="age">Age:</label>
                <input type="number" id="age" name="age"><br>

                <label for="gender">Gender:</label>
                <input type="text" id="gender" name="gender"><br>

                <label for="work_status">Work Status:</label>
                <input type="text" id="work_status" name="work_status"><br>

                <label for="sleep_hours">Avg. Sleep Hours:</label>
                <input type="number" id="sleep_hours" name="sleep_hours" step="0.5"><br>

                <!-- Add more fields as needed -->

                <button type="button" onclick="submitOnboarding()">Submit Details</button>
                <button type="button" onclick="skipOnboarding()">Skip</button>
            </form>
            <div id="prediction-results"></div>
        </div>

        <!-- Section for Chat Mode Selection (Initially Hidden) -->
        <div id="mode-selection" class="section" style="display: none;">
            <h2>How would you like to chat?</h2>
            <button onclick="startChat('text')">Text Chat</button>
            <button onclick="startChat('voice')">Voice Chat</button>
            <button onclick="startChat('video')">Video Chat</button>
        </div>

        <!-- Section for Chat Interface (Initially Hidden) -->
        <div id="chat-interface" class="section" style="display: none;">
            <h2>Chatting (<span id="chat-mode-indicator"></span>)</h2>
            <div id="chat-output">
                <!-- Chat messages will appear here -->
            </div>

            <!-- Video element for video chat -->
            <video id="video-feed" width="320" height="240" autoplay muted style="display: none;"></video>

            <div id="chat-input-area">
                 <input type="text" id="text-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                 <button id="send-button" onclick="sendMessage()">Send</button>
                 <button id="mic-button" onclick="toggleVoiceInput()" style="display: none;">🎤 Start Talking</button>
            </div>
             <div id="status-indicator"></div> <!-- For voice input status -->
        </div>

         <!-- Section for Report/Summary (Optional) -->
         <div id="report-section" class="section" style="display: none;">
             <h2>Session Summary</h2>
             <div id="session-report"></div>
             <button onclick="endSession()">End Session & Clear Data</button>
         </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
